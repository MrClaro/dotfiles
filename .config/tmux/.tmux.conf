# ============================
# TMUX CONFIGURATION
# ============================

# ----------------------------
# Terminal / Colors
# ----------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",tmux-256color:Tc"

# ----------------------------
# Prefix
# ----------------------------
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# ----------------------------
# Core Settings
# ----------------------------
set -g mouse on
set -g focus-events on
set -g history-limit 64096
set -s escape-time 10
set -g repeat-time 0

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

setw -g mode-keys vi
set -g set-titles on
set -g set-titles-string "#T"

set -g automatic-rename off
setw -g automatic-rename off
setw -g allow-rename off

# ----------------------------
# image.nvim Support
# ----------------------------
set -gq allow-passthrough on
set -g visual-activity off

# ----------------------------
# Status Bar Settings
# ----------------------------
set -g status-position top
set -g status-justify left
set -g status-right-length 100
set -g status-left-length 100

# ----------------------------
# Keyboard Bindings
# ----------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf recarregado!"
bind o run-shell "xdg-open '#{pane_current_path}'"
bind -r e kill-pane -a

# Vim navigation
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Resize panes
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# Move windows
bind-key -n C-S-Left swap-window -t -1 \; previous-window
bind-key -n C-S-Right swap-window -t +1 \; next-window

# ============================================================
# CATPPUCCIN THEME CONFIGURATION (v2.3.0 Standard)
# ============================================================
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

%hidden CUSTOM_RED="#9e0000"
%hidden CUSTOM_BG="#11111b"
%hidden CUSTOM_SURFACE="#313244"

set -g @catppuccin_window_current_number_color "$CUSTOM_RED"
set -g @catppuccin_window_current_text_color "$CUSTOM_SURFACE"
set -g @catppuccin_window_number_color "$CUSTOM_SURFACE"
set -g @catppuccin_window_text_color "$CUSTOM_RED"

set -g @catppuccin_pane_border_style "fg=$CUSTOM_SURFACE"
set -g @catppuccin_pane_active_border_style "fg=$CUSTOM_RED"

run "~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux"

set -g status-left ""
set -g status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_directory}"

# ----------------------------
# UI Native Overrides (Borders & Status line alignment)
# ----------------------------
set -g status-style "bg=$CUSTOM_BG,fg=#f5e0dc"
set -g message-style "bg=$CUSTOM_SURFACE,fg=$CUSTOM_RED"
set -g display-panes-active-colour "$CUSTOM_RED"
set -g display-panes-colour "#6c7086"
setw -g clock-mode-colour "$CUSTOM_RED"

# ============================================================
# UTILITY PLUGINS (TPM)
# ============================================================
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.config/tmux/plugins"

set -g @plugin "catppuccin/tmux#v2.3.0"
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "tmux-plugins/tmux-yank"
set -g @plugin "christoomey/vim-tmux-navigator"

# Initialize TMUX plugin manager 
run "~/.config/tmux/plugins/tpm/tpm"
